name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '[0-9]+.[0-9]+.[0-9]+'

  pull_request:

env:
  ALPINE_VER: '3'
  BASE_IMAGE_REVISION: r0
  AWS_REGION: us-east-1
  DEBUG: true

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check product release tags
      run: python3 tests/release_tags.py
  build:
    if: github.event_name == 'push'
    needs: release-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: amd64
    - uses: docker/setup-buildx-action@v3
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        GCP_SA: ${{ secrets.GCP_SA }}
      with:
        tags: latest
        platform: linux/amd64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        # Preserve the annotated tag instead of fetching the event commit into its ref.
        ref: ${{ github.ref }}
        fetch-depth: 0
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/github-release.sh
